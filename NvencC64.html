<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>视频剪辑指令生成器</title>
<style>
body{font-family:Arial;margin:20px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.button-group{display:flex;gap:10px;}
.drop-zone{border:2px dashed #ccc;padding:160px;text-align:center;margin-bottom:20px;}
.drop-zone.dragover{border-color:#000;}
.input-group{margin-bottom:10px;}
.output{margin-top:20px;padding:10px;background:#f5f5f5;border:1px solid #ccc;white-space:pre-wrap;}
.copy-button{padding:10px 20px;background:#007bff;color:#fff;border:none;cursor:pointer;}
.copy-button:hover{background:#0056b3;}
.copy-button.send{background:#ff9800;}
.copy-button.send:hover{background:#e68900;}
/* ── 模式切换 ── */
.mode-tabs{display:flex;margin-bottom:16px;border-bottom:2px solid #ccc;}
.mode-tab{padding:7px 22px;border:1px solid #ccc;border-bottom:none;cursor:pointer;background:#f0f0f0;font-size:14px;margin-right:4px;}
.mode-tab.active{background:#fff;border-bottom:2px solid #fff;margin-bottom:-2px;font-weight:bold;}
.mode-tab.local-active{color:#2a9d8f;}
.local-info{font-size:12px;color:#888;margin-left:8px;}
</style>
</head>
<body>
<div class="header">
  <h1>视频剪辑指令生成器</h1>
  <div class="button-group">
    <button class="copy-button send" id="send-btn" onclick="sendToRenderServer()">发送到渲染机</button>
  </div>
</div>

<div class="mode-tabs">
  <button class="mode-tab active" id="tab-remote" onclick="setMode('remote')">双机模式（渲染服务器）</button>
  <button class="mode-tab" id="tab-local" onclick="setMode('local')">本机快剪</button>
</div>

<div class="drop-zone" id="drop-zone">拖拽视频文件到这里</div>
<div class="input-group">
  <label id="path-label">视频文件路径</label>
  <input type="text" id="file-path" placeholder="例如：\\Shuijuno9slim\c\Videos\Replay.mp4"/>
</div>
<div class="input-group" id="local-dir-group" style="display:none">
  <label>本机输入目录 <span class="local-info">（已锁定，拖入文件自动拼合路径）</span></label>
  <input type="text" id="local-base-dir" value="E:\素材E" readonly style="width:55%;background:#f0f0f0;color:#555"/>
</div>
<div class="input-group">
  <label>--seek 起始时间</label>
  <input type="number" id="seek-minutes" placeholder="分钟" style="width:8%"/>
  <input type="number" id="seek-seconds" placeholder="秒钟" style="width:8%;"/>
</div>
<div class="input-group">
  <label>--seekto 结束时间</label>
  <input type="number" id="seekto-minutes" placeholder="分钟" style="width:8%"/>
  <input type="number" id="seekto-seconds" placeholder="秒钟" style="width:8%;"/>
</div>
<div class="input-group">
  <label id="codec-label">编码器&nbsp;</label>
  <select id="codec-override">
    <option value="auto">自动</option>
    <option value="av1">av1（NVEnc）</option>
    <option value="svt-av1">svt-av1（软件）</option>
  </select>
  &nbsp;&nbsp;
  <label>码率&nbsp;</label>
  <select id="bitrate-override">
    <option value="auto">自动</option>
  </select>
</div>
<div id="local-output-hint" style="display:none;margin-top:8px;padding:7px 10px;background:#e8f5e9;border:1px solid #a5d6a7;font-size:13px;color:#2e7d32;">
  本机快剪模式：固定使用 <strong>NVEnc HEVC（main10 / P7 / uhq）</strong> 编码（无论码率高低），输出保存到 <strong>C:\Users\Admin\Videos\Media Encoder 9Slim渲染机输出\</strong>，文件名格式为 <code>原名_hevc_码率k.mp4</code>
</div>
<div class="output" id="output"></div>

<script>
const REMOTE_SERVER = "http://192.168.68.68:8088/job";
const LOCAL_SERVER  = "http://127.0.0.1:8088/job";
const AUTH_TOKEN    = "20f01e4ae93f95d41cfdca0f180dec4c52430125";

const fp=document.getElementById("file-path"),out=document.getElementById("output");
const sm=document.getElementById("seek-minutes"),ss=document.getElementById("seek-seconds");
const em=document.getElementById("seekto-minutes"),es=document.getElementById("seekto-seconds");
const dz=document.getElementById("drop-zone");
const codecSel=document.getElementById("codec-override"),bitrateSel=document.getElementById("bitrate-override");
const localBaseDirInput=document.getElementById("local-base-dir");

// 填充码率选项：1000, 2000, 3000, ... ≤15000
(()=>{for(let v=1000;v<=15000;v+=1000){const o=document.createElement("option");o.value=v;o.textContent=v+"k";bitrateSel.appendChild(o);}})();

// ── 模式管理 ──
let currentMode = localStorage.getItem('renderMode') || 'remote';

function setMode(mode) {
  currentMode = mode;
  localStorage.setItem('renderMode', mode);
  const isLocal = mode === 'local';
  codecSel.disabled = isLocal;
  document.getElementById('codec-label').textContent = isLocal ? '编码器（本机固定 HEVC）' : '编码器';
  document.getElementById('tab-remote').className = 'mode-tab' + (isLocal ? '' : ' active');
  document.getElementById('tab-local').className  = 'mode-tab' + (isLocal ? ' active local-active' : '');
  document.getElementById('local-dir-group').style.display   = isLocal ? '' : 'none';
  document.getElementById('local-output-hint').style.display = isLocal ? '' : 'none';
  document.getElementById('send-btn').textContent = isLocal ? '发送到本机服务器' : '发送到渲染机';
  document.getElementById('path-label').textContent = isLocal ? '视频文件路径（完整本地路径）' : '视频文件路径';
  fp.placeholder = isLocal
    ? '例如：E:\\素材E\\clip.mp4（拖入文件自动填充）'
    : '例如：\\\\Shuijuno9slim\\c\\Videos\\Replay.mp4';
  fp.value = '';
  out.textContent = '';
}

// 本机输入目录锁定为 E:\素材E
const LOCAL_INPUT_DIR = "E:\\素材E";
localBaseDirInput.value = LOCAL_INPUT_DIR;
localBaseDirInput.readOnly = true;

// ── 拖放 ──
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('dragover');
  const f=e.dataTransfer.files[0]; if(!f) return;
  if(currentMode==='local'){
    const base=localBaseDirInput.value.trim();
    if(base){
      const sep=(base.endsWith('\\')||base.endsWith('/')) ? '' : '\\';
      fp.value=base+sep+f.name;
    } else {
      fp.value=f.name; // 没有基础目录时只填文件名，提示用户补全
    }
  } else {
    fp.value=`\\\\Shuijuno9slim\\c\\Videos\\${f.name}`;
  }
  out.textContent=`已选择: ${f.name}`;
});

// ── 码率/编码器计算 ──
function calcFileSize(v,a,d){return ((v*1.1+a)*d)/(8*1024);}
function calcBitrate(d){
  const max=50,def=9000,a=192,
    opts=[9000,8000,7000,6000,5000,4499,4375,4250,4125,4000,3900,3800,3700,3650,3600,3550,3500,3450,3400,3350,3300,3250,3200,3150,3125,3100,3075,3050,3025,3000];
  if(!d) return def;
  const fs=calcFileSize(def,a,d); if(fs<=max) return def;
  const req=Math.floor((max*8*1024)/(1.1*d))-a;
  for(const b of opts) if(b<=req) return b;
  return opts.at(-1);
}
function autoCodec(br){return br<4000?"svt-av1":"av1";}

// ── 发送请求 ──
async function postJob(payload, label, url) {
  try {
    const r=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Auth-Token':AUTH_TOKEN},
      body:JSON.stringify(payload)
    });
    const t=await r.text();
    alert(`${label} 返回: ${r.status} ${t}`);
  } catch(e) { alert(`${label} 失败: ${e}`); }
}

async function sendToRenderServer(){
  const p=fp.value.trim(); if(!p){alert("缺文件路径");return;}

  const sM=+sm.value||0,sS=+ss.value||0,eM=+em.value||0,eS=+es.value||0;
  const dur=eM*60+eS-(sM*60+sS);

  const manualCodec=codecSel.value!=="auto";
  const manualBr=bitrateSel.value!=="auto";
  let br,codecType;
  if(manualCodec&&manualBr){   br=+bitrateSel.value; codecType=codecSel.value;
  }else if(manualCodec){       br=calcBitrate(dur>0?dur:0); codecType=codecSel.value;
  }else if(manualBr){          br=+bitrateSel.value; codecType=autoCodec(br);
  }else{                       br=calcBitrate(dur>0?dur:0); codecType=autoCodec(br); }

  const jobLabel=codecType==="svt-av1"?"SVT-AV1任务":"NVEnc任务";
  const brSrc=manualBr?"手动":"自动计算", codecSrc=manualCodec?"手动":"自动";

  if(currentMode==='local'){
    // 本机快剪：固定 NVEnc HEVC，把完整路径作为 filename
    codecType='hevc';
    const pl={filename:p, codec:codecType, bitrate:br,
              seek:`${sM}:${sS}`, seekto:`${eM}:${eS}`, local:true};
    await postJob(pl, '本机快剪 HEVC 任务', LOCAL_SERVER);
    const base=p.split('\\').pop();
    const stem=base.replace(/\.[^.]+$/,'');
    const outName=`${stem}_hevc_${br}k.mp4`;
    out.textContent=`文件: ${base}\n时长: ${dur}秒\n码率: ${br}kbps（${brSrc}）\n编码器: HEVC / NVEnc（本机固定）\n输出文件: C:\\Users\\Admin\\Videos\\Media Encoder 9Slim渲染机输出\\${outName}\n任务已发送: 本机快剪 HEVC 任务`;
  } else {
    // 双机模式：原有逻辑，只传文件名
    const fn=p.split("\\").pop();
    const pl={filename:fn, codec:codecType, bitrate:br,
              seek:`${sM}:${sS}`, seekto:`${eM}:${eS}`, local:false};
    await postJob(pl, jobLabel, REMOTE_SERVER);
    out.textContent=`文件: ${fn}\n时长: ${dur}秒\n码率: ${br}kbps（${brSrc}）\n编码器: ${codecType}（${codecSrc}）\n任务已发送: ${jobLabel}`;
  }
}

// 初始化模式
setMode(currentMode);
</script>
</body>
</html>
